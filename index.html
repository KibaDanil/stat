<!DOCTYPE html>
<html lang="ru">
<head>
     <!-- ========== FAVICON ========== -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="android-chrome-512x512.png">
    <link rel="manifest" href="site.webmanifest">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кёрлинг · статистика + графики</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #f8fafc;
            display: flex;
            justify-content: center;
            padding: 0.8rem;
        }
        .app {
            max-width: 1200px;
            width: 100%;
        }
        h1 {
            font-weight: 400;
            font-size: 1.2rem;
            color: #1e293b;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 0.2rem;
            margin-bottom: 0.6rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            flex-wrap: wrap;
        }
        h1 small {
            font-size: 0.65rem;
            font-weight: 300;
            color: #475569;
            margin-left: auto;
        }

        /* Save indicator */
        .save-indicator {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.65rem;
            color: #16a34a;
            background: #dcfce7;
            padding: 0.1rem 0.6rem;
            border-radius: 30px;
            opacity: 0;
            transition: opacity 0.4s;
            margin-left: 0.4rem;
        }
        .save-indicator.show {
            opacity: 1;
        }
        .save-indicator::before {
            content: '✓';
            font-weight: 700;
        }

        /* Add throw section */
        .add-throw-section {
            background: #fff;
            border-radius: 12px;
            padding: 0.5rem 0.8rem;
            border: 1px solid #e2e8f0;
            margin-bottom: 0.4rem;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.2rem 0.8rem;
            align-items: start;
        }
        .form-col {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
        }
        .form-group {
            display: flex;
            align-items: center;
            gap: 0.2rem 0.3rem;
            flex-wrap: wrap;
        }
        .form-group label {
            font-size: 0.65rem;
            font-weight: 500;
            color: #475569;
            min-width: 38px;
        }
        .form-group select {
            background: #f8fafc;
            border: 1px solid #d1d9e6;
            border-radius: 30px;
            padding: 0.1rem 0.5rem;
            font-size: 0.7rem;
            outline: none;
            flex: 1;
            min-width: 60px;
            height: 24px;
        }
        .form-group select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.06);
        }
        .form-actions {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin-top: 0.1rem;
            grid-column: 1 / -1;
            flex-wrap: wrap;
        }
        .btn {
            border: none;
            padding: 0.1rem 1rem;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.7rem;
            cursor: pointer;
            height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            transition: background 0.15s, border-color 0.15s, color 0.15s;
        }
        .btn-primary {
            background: #2563eb;
            color: #fff;
            border: 1px solid #1d4ed8;
        }
        .btn-primary:hover {
            background: #1d4ed8;
        }
        /* Flash red state for add button */
        .btn-primary.flash-red {
            background: #dc2626 !important;
            border-color: #b91c1c !important;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #d1d9e6;
            color: #1e293b;
        }
        .btn-outline:hover {
            background: #f1f5f9;
            border-color: #94a3b8;
        }
        .btn-outline:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .btn-danger {
            background: #dc2626;
            color: #fff;
            border: 1px solid #b91c1c;
        }
        .btn-danger:hover {
            background: #b91c1c;
        }
        .btn-success {
            background: #16a34a;
            color: #fff;
            border: 1px solid #15803d;
        }
        .btn-success:hover {
            background: #15803d;
        }
        .btn-toggle-charts {
            background: #0f172a;
            color: #fff;
            border: 1px solid #1e293b;
        }
        .btn-toggle-charts:hover {
            background: #1e293b;
        }
        .error-msg {
            color: #b91c1c;
            font-size: 0.65rem;
            background: #fee2e2;
            padding: 0.02rem 0.8rem;
            border-radius: 40px;
            height: 20px;
            line-height: 20px;
            display: none;
        }
        .undo-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 0.5rem;
            padding: 0.1rem 0;
        }
        .undo-badge {
            font-size: 0.55rem;
            color: #64748b;
            background: #f1f5f9;
            padding: 0 0.4rem;
            border-radius: 30px;
            margin-left: 0.15rem;
        }

        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 0.5rem;
            margin-bottom: 0.6rem;
        }
        .player-card {
            background: #fff;
            border-radius: 12px;
            border: 1px solid #eef2f6;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        .player-header {
            padding: 0.4rem 0.8rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.1s;
        }
        .player-header:hover {
            background: #f1f5f9;
        }
        .player-name {
            font-weight: 500;
            font-size: 0.85rem;
            color: #0b1e33;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .dot-blue {
            display: inline-block;
            width: 7px;
            height: 7px;
            background: #2563eb;
            border-radius: 50%;
        }
        .dot-red {
            display: inline-block;
            width: 7px;
            height: 7px;
            background: #dc2626;
            border-radius: 50%;
        }
        .toggle-icon {
            font-size: 0.85rem;
            color: #64748b;
            user-select: none;
        }
        .player-stats {
            padding: 0 0.8rem 0.6rem;
            border-top: 1px solid #eef2f6;
            display: none;
        }
        .stat-row {
            margin-top: 0.35rem;
        }
        .stat-label {
            font-weight: 500;
            font-size: 0.7rem;
            color: #1e293b;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px dashed #e9edf2;
            padding-bottom: 0.1rem;
            margin-bottom: 0.1rem;
        }
        .stat-percent {
            font-weight: 600;
            color: #0b1e33;
        }
        .stat-percent .small-count {
            font-weight: 400;
            color: #475569;
            font-size: 0.6rem;
        }
        .error-types {
            display: flex;
            flex-wrap: wrap;
            gap: 0.1rem 0.3rem;
            font-size: 0.6rem;
        }
        .error-types span {
            background: #f1f5f9;
            padding: 0.02rem 0.4rem;
            border-radius: 30px;
            font-size: 0.55rem;
        }
        .no-throws {
            color: #94a3b8;
            font-size: 0.6rem;
            font-style: italic;
        }

        .footer-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.4rem;
            margin-top: 0.4rem;
            border-top: 1px solid #edf2f7;
            padding-top: 0.4rem;
            flex-wrap: wrap;
        }
        .footer-left {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
        }
        .footer-right {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        /* Control panel (match + players) placed above charts */
        .control-panel {
            background: #fff;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            padding: 0.6rem 1rem;
            margin-top: 0.6rem;
            margin-bottom: 0.6rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .control-panel .row {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex-wrap: wrap;
        }
        .control-panel .row label {
            font-size: 0.75rem;
            font-weight: 500;
            color: #1e293b;
            white-space: nowrap;
        }
        .control-panel .row select,
        .control-panel .row input[type="text"] {
            background: #f8fafc;
            border: 1px solid #d1d9e6;
            border-radius: 30px;
            padding: 0.25rem 0.8rem;
            font-size: 0.75rem;
            outline: none;
            height: 28px;
        }
        .control-panel .row select:focus,
        .control-panel .row input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.06);
        }
        .control-panel .row select {
            flex: 1;
            min-width: 140px;
        }
        .control-panel .row input[type="text"] {
            flex: 1;
            min-width: 120px;
        }
        .match-badge {
            font-size: 0.65rem;
            background: #dbeafe;
            color: #1d4ed8;
            padding: 0.15rem 0.7rem;
            border-radius: 30px;
            font-weight: 500;
            white-space: nowrap;
        }
        .player-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
            margin-left: 0.3rem;
        }
        .player-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            background: #f1f5f9;
            padding: 0.15rem 0.4rem 0.15rem 0.7rem;
            border-radius: 30px;
            font-size: 0.7rem;
            color: #1e293b;
        }
        .player-tag .remove-player {
            cursor: pointer;
            color: #dc2626;
            font-weight: 700;
            font-size: 0.75rem;
            padding: 0 0.2rem;
            line-height: 1;
        }
        .player-tag .remove-player:hover {
            color: #b91c1c;
        }

        /* Charts section */
        .charts-section {
            margin-top: 0.2rem;
            border-top: 2px solid #e2e8f0;
            padding-top: 0.8rem;
            display: none;
        }
        .charts-section.open {
            display: block;
        }
        .charts-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
            flex-wrap: wrap;
            gap: 0.4rem;
        }
        .charts-header h2 {
            font-size: 1rem;
            font-weight: 500;
            color: #1e293b;
        }
        .charts-header .match-info {
            font-size: 0.7rem;
            color: #475569;
            background: #f1f5f9;
            padding: 0.15rem 0.7rem;
            border-radius: 30px;
        }
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }
        .chart-card {
            background: #ffffff;
            padding: 1rem 1.2rem 1.2rem;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            border: 1px solid #eef2f6;
        }
        .chart-card h3 {
            margin: 0 0 0.6rem 0;
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
            color: #1e293b;
        }
        .chart-card .avg-label {
            font-weight: 400;
            color: #64748b;
            font-size: 0.75rem;
        }
        .chart-wrapper {
            position: relative;
            height: 220px;
            width: 100%;
        }
        .no-chart-msg {
            text-align: center;
            color: #94a3b8;
            font-size: 0.75rem;
            padding: 1rem 0;
            font-style: italic;
        }

        @media (max-width: 700px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }
        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
                gap: 0.2rem;
            }
            .form-actions {
                flex-wrap: wrap;
            }
            .add-throw-section {
                padding: 0.5rem;
            }
            .footer-actions {
                flex-direction: column;
                align-items: stretch;
            }
            .footer-left, .footer-right {
                justify-content: center;
            }
            .btn {
                width: 100%;
                justify-content: center;
            }
            .undo-bar {
                justify-content: stretch;
            }
            .undo-bar .btn {
                width: 100%;
                justify-content: center;
            }
            .players-grid {
                grid-template-columns: 1fr 1fr;
                gap: 0.4rem;
            }
            .control-panel .row {
                flex-direction: column;
                align-items: stretch;
            }
        }
        @media (max-width: 450px) {
            .players-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div class="app">
    <h1>🥌 Кёрлинг <small id="playerCountLabel">4 игрока</small> <span class="save-indicator" id="saveIndicator">Сохранено</span></h1>

    <!-- Add throw -->
    <div class="add-throw-section">
        <div class="form-grid">
            <div class="form-col">
                <div class="form-group">
                    <label for="playerSelect">Игрок</label>
                    <select id="playerSelect"></select>
                </div>
                <div class="form-group">
                    <label for="shotType">Вид</label>
                    <select id="shotType">
                        <option value="ТейкИн">ТейкИн</option>
                        <option value="ТейкАут">ТейкАут</option>
                        <option value="ДроИн">ДроИн</option>
                        <option value="ДроАут">ДроАут</option>
                    </select>
                </div>
            </div>
            <div class="form-col">
                <div class="form-group">
                    <label for="errorType">Ошибка</label>
                    <select id="errorType">
                        <option value="">—</option>
                        <option value="узко">узко</option>
                        <option value="широко">широко</option>
                        <option value="слабо">слабо</option>
                        <option value="сильно">сильно</option>
                        <option value="другое">другое</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="accuracy">Точность</label>
                    <select id="accuracy">
                        <option value="0">0%</option>
                        <option value="50">50%</option>
                        <option value="100" selected>100%</option>
                    </select>
                </div>
            </div>
            <div class="form-actions">
                <button class="btn btn-primary" id="addThrowBtn">➕ Добавить</button>
                <div class="error-msg" id="formFeedback"></div>
            </div>
        </div>
    </div>

    <div class="undo-bar">
        <button class="btn btn-outline" id="undoBtn">↩ Отменить</button>
    </div>

    <!-- Player cards -->
    <div class="players-grid" id="playersGrid"></div>

    <!-- Control panel: match selection & player management (below cards, above charts) -->
    <div class="control-panel">
        <div class="row">
            <label for="matchSelect">Матч:</label>
            <select id="matchSelect"></select>
            <span class="match-badge" id="matchBadge">Матч 1</span>
            <input type="text" id="newMatchInput" placeholder="Соперник (название)" maxlength="40">
            <button class="btn btn-primary" id="addMatchBtn">➕ Добавить матч</button>
            <button class="btn btn-danger" id="removeMatchBtn" title="Удалить выбранный матч">✕ Удалить</button>
        </div>
        <div class="row">
            <label>Игроки:</label>
            <input type="text" id="newPlayerInput" placeholder="Имя игрока" maxlength="20">
            <button class="btn btn-primary" id="addPlayerBtn">➕ Добавить</button>
            <div class="player-tags" id="playerTags"></div>
        </div>
    </div>

    <!-- Footer actions -->
    <div class="footer-actions">
        <div class="footer-left">
            <button class="btn btn-toggle-charts" id="toggleChartsBtn">📊 Графики</button>
        </div>
        <div class="footer-right">
            <button class="btn btn-danger" id="resetBtn">✖ Сбросить</button>
        </div>
    </div>

    <!-- Charts section -->
    <div class="charts-section" id="chartsSection">
        <div class="charts-header">
            <h2>📈 Точность по матчам (турнир)</h2>
            <span class="match-info" id="chartsMatchInfo">Все матчи</span>
        </div>
        <div class="charts-grid" id="chartsGrid"></div>
    </div>
</div>

<script>
    // ==================== КОНСТАНТЫ ====================
    const TYPES = ['ТейкИн', 'ТейкАут', 'ДроИн', 'ДроАут'];
    const ERRORS = ['узко', 'широко', 'слабо', 'сильно', 'другое'];
    const STORAGE = 'curling_stats_combined_v4';
    const UNDO_KEY = 'curling_undo_combined_v4';
    const MAX_UNDO = 3;

    const INITIAL_PLAYERS = ['Александр', 'МаксимВ', 'Елена', 'МаксимЗ'];
    const CHART_COLORS = ['#f1c40f', '#2ecc71', '#e74c3c', '#3498db', '#9b59b6', '#e67e22', '#1abc9c', '#e84393'];

    // ==================== СОСТОЯНИЕ ====================
    let players = [];
    let matches = [];
    let data = {};
    let currentMatchId = null;
    let history = [];
    let chartsVisible = false;
    let chartInstances = [];
    let saveIndicatorTimer = null;

    // ==================== ВСПОМОГАТЕЛЬНЫЕ ====================
    function emptyTypeStats() {
        return { count: 0, sum: 0, errors: { узко: 0, широко: 0, слабо: 0, сильно: 0, другое: 0 } };
    }
    function emptyMatchStats() {
        const s = {};
        TYPES.forEach(t => s[t] = emptyTypeStats());
        return s;
    }
    function emptyPlayerStats() {
        const s = {};
        matches.forEach(m => s[m.id] = emptyMatchStats());
        return s;
    }
    function initDataForPlayers(playerList) {
        const d = {};
        playerList.forEach(name => d[name] = emptyPlayerStats());
        return d;
    }

    function nextMatchId() {
        let max = 0;
        matches.forEach(m => {
            const num = parseInt(m.id.replace('match', '')) || 0;
            if (num > max) max = num;
        });
        return 'match' + (max + 1);
    }

    // ==================== ИНДИКАТОР СОХРАНЕНИЯ ====================
    function showSaveIndicator() {
        const el = document.getElementById('saveIndicator');
        el.classList.add('show');
        if (saveIndicatorTimer) clearTimeout(saveIndicatorTimer);
        saveIndicatorTimer = setTimeout(() => {
            el.classList.remove('show');
        }, 1800);
    }

    // ==================== ЗАГРУЗКА / СОХРАНЕНИЕ ====================
    function load() {
        try {
            const raw = localStorage.getItem(STORAGE);
            if (raw) {
                const saved = JSON.parse(raw);
                if (saved && Array.isArray(saved.players) && Array.isArray(saved.matches) && saved.data) {
                    players = saved.players;
                    matches = saved.matches;
                    data = saved.data;
                    currentMatchId = saved.currentMatchId || (matches[0] ? matches[0].id : null);
                    players.forEach(name => {
                        if (!data[name]) data[name] = {};
                        matches.forEach(m => {
                            if (!data[name][m.id]) data[name][m.id] = emptyMatchStats();
                        });
                    });
                    return;
                }
            }
        } catch (_) { /* ignore */ }

        players = [...INITIAL_PLAYERS];
        matches = [{ id: 'match1', label: 'Матч 1: Соперник' }];
        data = initDataForPlayers(players);
        currentMatchId = matches[0].id;
        save();
    }

    function save() {
        localStorage.setItem(STORAGE, JSON.stringify({
            players,
            matches,
            data,
            currentMatchId
        }));
        showSaveIndicator();
    }

    function loadHistory() {
        try {
            const h = JSON.parse(localStorage.getItem(UNDO_KEY));
            if (Array.isArray(h)) history = h.slice(0, MAX_UNDO);
        } catch (_) { /* ignore */ }
    }
    function saveHistory() {
        localStorage.setItem(UNDO_KEY, JSON.stringify(history));
    }
    function pushState() {
        history.push(JSON.parse(JSON.stringify({ players, matches, data })));
        if (history.length > MAX_UNDO) history.shift();
        saveHistory();
        updateUndo();
    }
    function popState() {
        if (!history.length) return null;
        const s = history.pop();
        saveHistory();
        updateUndo();
        return s;
    }
    function updateUndo() {
        const btn = document.getElementById('undoBtn');
        const c = history.length;
        btn.disabled = !c;
        btn.innerHTML = `↩ Отменить${c ? ` <span class="undo-badge">${c}</span>` : ''}`;
    }

    // ==================== РАСЧЁТЫ ====================
    function pct(matchStats, type) {
        const s = matchStats[type];
        return s.count ? Math.round((s.sum / s.count) * 10) / 10 : 0;
    }

    function totalStatsForPlayer(playerName) {
        const result = {};
        TYPES.forEach(t => {
            result[t] = { count: 0, sum: 0, errors: { узко: 0, широко: 0, слабо: 0, сильно: 0, другое: 0 } };
        });
        const playerMatches = data[playerName];
        if (!playerMatches) return result;
        matches.forEach(m => {
            const ms = playerMatches[m.id];
            if (!ms) return;
            TYPES.forEach(t => {
                const s = ms[t];
                result[t].count += s.count;
                result[t].sum += s.sum;
                ERRORS.forEach(e => result[t].errors[e] += s.errors[e] || 0);
            });
        });
        return result;
    }

    function pctTotal(totalStats, type) {
        const s = totalStats[type];
        return s.count ? Math.round((s.sum / s.count) * 10) / 10 : 0;
    }

    function matchAccuracy(playerName, matchId) {
        const ms = data[playerName] && data[playerName][matchId];
        if (!ms) return null;
        let totalCount = 0;
        let totalSum = 0;
        TYPES.forEach(t => {
            totalCount += ms[t].count;
            totalSum += ms[t].sum;
        });
        if (totalCount === 0) return null;
        return Math.round((totalSum / totalCount) * 10) / 10;
    }

    // ==================== RENDER ====================
    function render() {
        renderMatchSelect();
        renderPlayerTags();
        renderPlayerSelect();
        renderPlayersGrid();
        renderCharts();
        document.getElementById('playerCountLabel').textContent = `${players.length} ${players.length === 1 ? 'игрок' : 'игрока'}`;
        updateUndo();
        const curMatch = matches.find(m => m.id === currentMatchId);
        document.getElementById('matchBadge').textContent = curMatch ? curMatch.label : '—';
        const chartsInfo = document.getElementById('chartsMatchInfo');
        if (chartsInfo) {
            chartsInfo.textContent = curMatch ? `Выбран: ${curMatch.label}` : 'Все матчи';
        }
    }

    function renderMatchSelect() {
        const sel = document.getElementById('matchSelect');
        sel.innerHTML = matches.map(m =>
            `<option value="${m.id}">${m.label}</option>`
        ).join('');
        if (matches.some(m => m.id === currentMatchId)) {
            sel.value = currentMatchId;
        } else if (matches.length) {
            currentMatchId = matches[0].id;
            sel.value = currentMatchId;
        }
        document.getElementById('removeMatchBtn').disabled = matches.length <= 1;
    }

    function renderPlayerTags() {
        const container = document.getElementById('playerTags');
        container.innerHTML = players.map(name =>
            `<span class="player-tag">${name} <span class="remove-player" data-name="${name}" title="Удалить">✕</span></span>`
        ).join('');
        container.querySelectorAll('.remove-player').forEach(el => {
            el.addEventListener('click', (e) => {
                e.stopPropagation();
                removePlayer(el.dataset.name);
            });
        });
    }

    function renderPlayerSelect() {
        const sel = document.getElementById('playerSelect');
        const cur = sel.value;
        sel.innerHTML = players.map(n => `<option value="${n}">${n}</option>`).join('');
        if (players.includes(cur)) sel.value = cur;
        else if (players.length) sel.value = players[0];
    }

    function renderPlayersGrid() {
        const grid = document.getElementById('playersGrid');
        grid.innerHTML = '';
        if (players.length === 0) {
            grid.innerHTML = '<div style="padding:1rem;color:#94a3b8;font-size:0.8rem;text-align:center;grid-column:1/-1;">Нет игроков. Добавьте игрока ниже.</div>';
            return;
        }
        players.forEach(name => {
            const card = document.createElement('div');
            card.className = 'player-card';
            const header = document.createElement('div');
            header.className = 'player-header';
            header.innerHTML = `<span class="player-name">${name} <span class="dot-blue"></span><span class="dot-red"></span></span><span class="toggle-icon">▾</span>`;

            const body = document.createElement('div');
            body.className = 'player-stats';

            const total = totalStatsForPlayer(name);
            TYPES.forEach(t => {
                const s = total[t];
                const p = s.count ? pctTotal(total, t) : 0;
                const row = document.createElement('div');
                row.className = 'stat-row';
                row.innerHTML = `
                    <div class="stat-label">
                        <span>${t}</span>
                        <span class="stat-percent">${s.count ? p + '%' : '0%'} <span class="small-count">(${s.count})</span></span>
                    </div>
                    <div class="error-types">${s.count ? (() => {
                        const parts = ERRORS.filter(e => s.errors[e]).map(e => `${e}: ${s.errors[e]}`);
                        return parts.length ? parts.map(p => `<span>${p}</span>`).join('') : '<span style="background:transparent;color:#94a3b8;">ошибок нет</span>';
                    })() : '<span class="no-throws">нет бросков</span>'}</div>
                `;
                body.appendChild(row);
            });

            const matchAcc = matchAccuracy(name, currentMatchId);
            const matchInfo = document.createElement('div');
            matchInfo.style.cssText = 'margin-top:0.4rem;padding-top:0.3rem;border-top:1px dashed #e2e8f0;font-size:0.65rem;color:#475569;';
            const curMatch = matches.find(m => m.id === currentMatchId);
            matchInfo.innerHTML = `📌 ${curMatch ? curMatch.label : 'матч'}: <strong>${matchAcc !== null ? matchAcc + '%' : 'нет бросков'}</strong>`;
            body.appendChild(matchInfo);

            header.onclick = () => {
                const d = body.style.display === 'none';
                body.style.display = d ? 'block' : 'none';
                header.querySelector('.toggle-icon').textContent = d ? '▴' : '▾';
            };
            card.append(header, body);
            grid.appendChild(card);
        });
    }

    // ==================== ГРАФИКИ ====================
    function renderCharts() {
        const section = document.getElementById('chartsSection');
        if (!chartsVisible) {
            section.classList.remove('open');
            return;
        }
        section.classList.add('open');

        chartInstances.forEach(c => { try { c.destroy(); } catch (_) {} });
        chartInstances = [];

        const grid = document.getElementById('chartsGrid');
        grid.innerHTML = '';

        if (players.length === 0) {
            grid.innerHTML = '<div class="no-chart-msg" style="grid-column:1/-1;">Нет игроков для отображения графиков.</div>';
            return;
        }
        if (matches.length === 0) {
            grid.innerHTML = '<div class="no-chart-msg" style="grid-column:1/-1;">Нет матчей. Добавьте хотя бы один матч.</div>';
            return;
        }

        players.forEach((name, idx) => {
            const card = document.createElement('div');
            card.className = 'chart-card';

            const validValues = [];
            const chartData = matches.map(m => {
                const acc = matchAccuracy(name, m.id);
                if (acc !== null) validValues.push(acc);
                return acc;
            });
            const avg = validValues.length ? Math.round(validValues.reduce((a, b) => a + b, 0) / validValues.length) : null;
            const color = CHART_COLORS[idx % CHART_COLORS.length];

            card.innerHTML = `
                <h3>${name} <span class="avg-label">(${avg !== null ? avg + '%' : '—'})</span></h3>
                <div class="chart-wrapper">
                    <canvas id="chart-${idx}"></canvas>
                </div>
            `;
            grid.appendChild(card);

            setTimeout(() => {
                const canvas = document.getElementById(`chart-${idx}`);
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const chart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: matches.map(m => m.label),
                        datasets: [{
                            label: name,
                            data: chartData,
                            borderColor: color,
                            backgroundColor: color + '33',
                            pointBackgroundColor: color,
                            pointBorderColor: '#ffffff',
                            pointBorderWidth: 2,
                            pointRadius: 4,
                            pointHoverRadius: 6,
                            borderWidth: 2.5,
                            tension: 0.2,
                            fill: true,
                            spanGaps: false
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                callbacks: {
                                    label: (context) => {
                                        return context.parsed.y !== null ? context.parsed.y + '%' : 'нет данных';
                                    }
                                }
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                max: 100,
                                min: 0,
                                ticks: {
                                    stepSize: 20,
                                    callback: (v) => v + '%',
                                    font: { size: 10 }
                                },
                                grid: { color: '#e9ecef' }
                            },
                            x: {
                                ticks: {
                                    font: { size: 9 },
                                    maxRotation: 20
                                },
                                grid: { display: false }
                            }
                        }
                    }
                });
                chartInstances.push(chart);
            }, 0);
        });
    }

    function toggleCharts() {
        chartsVisible = !chartsVisible;
        const btn = document.getElementById('toggleChartsBtn');
        btn.textContent = chartsVisible ? '📉 Скрыть графики' : '📊 Графики';
        renderCharts();
    }

    // ==================== УПРАВЛЕНИЕ МАТЧАМИ ====================
    function addMatch() {
        const input = document.getElementById('newMatchInput');
        const opponent = input.value.trim();
        if (!opponent) {
            showFeedback('Введите название соперника');
            return;
        }
        pushState();
        const id = nextMatchId();
        const num = parseInt(id.replace('match', ''));
        const label = `Матч ${num}: ${opponent}`;
        matches.push({ id, label });
        players.forEach(name => {
            if (!data[name]) data[name] = {};
            data[name][id] = emptyMatchStats();
        });
        currentMatchId = id;
        input.value = '';
        save();
        render();
        hideFeedback();
    }

    function removeMatch() {
        if (matches.length <= 1) {
            showFeedback('Нельзя удалить единственный матч');
            return;
        }
        const curMatch = matches.find(m => m.id === currentMatchId);
        if (!curMatch) return;
        if (!confirm(`Удалить "${curMatch.label}" и всю статистику по этому матчу?`)) return;
        pushState();
        matches = matches.filter(m => m.id !== currentMatchId);
        players.forEach(name => {
            if (data[name]) delete data[name][currentMatchId];
        });
        currentMatchId = matches[0].id;
        save();
        render();
        hideFeedback();
    }

    // ==================== ДОБАВЛЕНИЕ / УДАЛЕНИЕ ИГРОКОВ ====================
    function addPlayer() {
        const input = document.getElementById('newPlayerInput');
        const name = input.value.trim();
        if (!name) {
            showFeedback('Введите имя игрока');
            return;
        }
        if (players.includes(name)) {
            showFeedback('Игрок с таким именем уже есть');
            return;
        }
        pushState();
        players.push(name);
        data[name] = emptyPlayerStats();
        save();
        input.value = '';
        render();
        hideFeedback();
    }

    function removePlayer(name) {
        if (players.length <= 1) {
            showFeedback('Должен остаться хотя бы один игрок');
            return;
        }
        if (!confirm(`Удалить игрока "${name}" и всю его статистику?`)) return;
        pushState();
        players = players.filter(p => p !== name);
        delete data[name];
        const sel = document.getElementById('playerSelect');
        if (!players.includes(sel.value) && players.length) {
            sel.value = players[0];
        }
        save();
        render();
        hideFeedback();
    }

    // ==================== ДОБАВЛЕНИЕ БРОСКА ====================
    function addThrow() {
        const name = document.getElementById('playerSelect').value;
        const type = document.getElementById('shotType').value;
        const err = document.getElementById('errorType').value;
        const acc = parseInt(document.getElementById('accuracy').value);

        if (!players.includes(name)) {
            showFeedback('Выберите игрока');
            return;
        }
        if (!currentMatchId) {
            showFeedback('Сначала добавьте матч');
            return;
        }
        if (!data[name]) data[name] = {};
        if (!data[name][currentMatchId]) data[name][currentMatchId] = emptyMatchStats();

        pushState();
        const s = data[name][currentMatchId][type];
        s.count++;
        s.sum += acc;
        if (err && ERRORS.includes(err)) s.errors[err]++;

        save();
        render();
        hideFeedback();
        document.getElementById('errorType').value = '';
        document.getElementById('accuracy').value = '100';

        // Flash the add button red
        const btn = document.getElementById('addThrowBtn');
        btn.classList.add('flash-red');
        setTimeout(() => {
            btn.classList.remove('flash-red');
        }, 1000);
    }

    // ==================== СБРОС ====================
    function resetAll() {
        if (!confirm('Сбросить всю статистику и вернуть исходных игроков и матчи?')) return;
        pushState();
        players = [...INITIAL_PLAYERS];
        matches = [{ id: 'match1', label: 'Матч 1: Соперник' }];
        data = initDataForPlayers(players);
        currentMatchId = matches[0].id;
        history = [];
        saveHistory();
        save();
        render();
    }

    // ==================== ФИДБЕК ====================
    function showFeedback(msg) {
        const fb = document.getElementById('formFeedback');
        fb.textContent = msg;
        fb.style.display = 'inline-block';
        setTimeout(() => { fb.style.display = 'none'; }, 3000);
    }
    function hideFeedback() {
        document.getElementById('formFeedback').style.display = 'none';
    }

    // ==================== ИНИЦИАЛИЗАЦИЯ ====================
    document.addEventListener('DOMContentLoaded', function () {
        load();
        loadHistory();
        render();

        document.getElementById('addThrowBtn').onclick = addThrow;
        document.getElementById('addPlayerBtn').onclick = addPlayer;
        document.getElementById('newPlayerInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); addPlayer(); }
        });

        document.getElementById('addMatchBtn').onclick = addMatch;
        document.getElementById('newMatchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); addMatch(); }
        });
        document.getElementById('removeMatchBtn').onclick = removeMatch;

        document.getElementById('resetBtn').onclick = resetAll;
        document.getElementById('undoBtn').onclick = () => {
            if (!history.length) return showFeedback('Нет действий');
            if (confirm('Отменить последнее действие?')) {
                const s = popState();
                if (s) {
                    players = s.players;
                    matches = s.matches;
                    data = s.data;
                    if (!matches.some(m => m.id === currentMatchId)) {
                        currentMatchId = matches.length ? matches[0].id : null;
                    }
                    save();
                    render();
                    hideFeedback();
                }
            }
        };

        document.getElementById('toggleChartsBtn').onclick = toggleCharts;

        document.getElementById('matchSelect').addEventListener('change', function () {
            currentMatchId = this.value;
            save();
            renderMatchSelect();
            renderPlayersGrid();
            if (chartsVisible) renderCharts();
            const curMatch = matches.find(m => m.id === currentMatchId);
            document.getElementById('matchBadge').textContent = curMatch ? curMatch.label : '—';
            document.getElementById('chartsMatchInfo').textContent = curMatch ? `Выбран: ${curMatch.label}` : 'Все матчи';
        });

        document.querySelectorAll('#playerSelect, #shotType, #errorType, #accuracy').forEach(el => {
            el.addEventListener('keypress', e => {
                if (e.key === 'Enter') { e.preventDefault(); addThrow(); }
            });
        });
    });
</script>
</body>
</html>
