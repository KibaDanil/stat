<!DOCTYPE html>
<html lang="ru">
<head>
     <!-- ========== FAVICON ========== -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="android-chrome-512x512.png">
    <link rel="manifest" href="site.webmanifest">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кёрлинг · статистика</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #f8fafc;
            display: flex;
            justify-content: center;
            padding: 0.8rem;
        }
        .app {
            max-width: 1200px;
            width: 100%;
        }
        h1 {
            font-weight: 400;
            font-size: 1.2rem;
            color: #1e293b;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 0.2rem;
            margin-bottom: 0.6rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        h1 small {
            font-size: 0.65rem;
            font-weight: 300;
            color: #475569;
            margin-left: auto;
        }

        .add-throw-section {
            background: #fff;
            border-radius: 12px;
            padding: 0.5rem 0.8rem;
            border: 1px solid #e2e8f0;
            margin-bottom: 0.4rem;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.2rem 0.8rem;
            align-items: start;
        }
        .form-col {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
        }
        .form-group {
            display: flex;
            align-items: center;
            gap: 0.2rem 0.3rem;
            flex-wrap: wrap;
        }
        .form-group label {
            font-size: 0.65rem;
            font-weight: 500;
            color: #475569;
            min-width: 38px;
        }
        .form-group select {
            background: #f8fafc;
            border: 1px solid #d1d9e6;
            border-radius: 30px;
            padding: 0.1rem 0.5rem;
            font-size: 0.7rem;
            outline: none;
            flex: 1;
            min-width: 60px;
            height: 24px;
        }
        .form-group select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.06);
        }
        .form-actions {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin-top: 0.1rem;
            grid-column: 1 / -1;
        }
        .btn {
            border: none;
            padding: 0.1rem 1rem;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.7rem;
            cursor: pointer;
            height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            transition: 0.15s;
        }
        .btn-primary {
            background: #2563eb;
            color: #fff;
            border: 1px solid #1d4ed8;
        }
        .btn-primary:hover {
            background: #1d4ed8;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #d1d9e6;
            color: #1e293b;
        }
        .btn-outline:hover {
            background: #f1f5f9;
            border-color: #94a3b8;
        }
        .btn-outline:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .btn-danger {
            background: #dc2626;
            color: #fff;
            border: 1px solid #b91c1c;
        }
        .btn-danger:hover {
            background: #b91c1c;
        }
        .btn-success {
            background: #16a34a;
            color: #fff;
            border: 1px solid #15803d;
        }
        .btn-success:hover {
            background: #15803d;
        }
        .btn-import {
            background: #7c3aed;
            color: #fff;
            border: 1px solid #6d28d9;
            position: relative;
            overflow: hidden;
        }
        .btn-import:hover {
            background: #6d28d9;
        }
        .btn-import input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        .error-msg {
            color: #b91c1c;
            font-size: 0.65rem;
            background: #fee2e2;
            padding: 0.02rem 0.8rem;
            border-radius: 40px;
            height: 20px;
            line-height: 20px;
            display: none;
        }
        .undo-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 0.5rem;
            padding: 0.1rem 0;
        }
        .undo-badge {
            font-size: 0.55rem;
            color: #64748b;
            background: #f1f5f9;
            padding: 0 0.4rem;
            border-radius: 30px;
            margin-left: 0.15rem;
        }

        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 0.5rem;
            margin-bottom: 0.6rem;
        }
        .player-card {
            background: #fff;
            border-radius: 12px;
            border: 1px solid #eef2f6;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        .player-header {
            padding: 0.4rem 0.8rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.1s;
        }
        .player-header:hover {
            background: #f1f5f9;
        }
        .player-name {
            font-weight: 500;
            font-size: 0.85rem;
            color: #0b1e33;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .dot-blue {
            display: inline-block;
            width: 7px;
            height: 7px;
            background: #2563eb;
            border-radius: 50%;
        }
        .dot-red {
            display: inline-block;
            width: 7px;
            height: 7px;
            background: #dc2626;
            border-radius: 50%;
        }
        .toggle-icon {
            font-size: 0.85rem;
            color: #64748b;
            user-select: none;
        }
        .player-stats {
            padding: 0 0.8rem 0.6rem;
            border-top: 1px solid #eef2f6;
            display: none;
        }
        .stat-row {
            margin-top: 0.35rem;
        }
        .stat-label {
            font-weight: 500;
            font-size: 0.7rem;
            color: #1e293b;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px dashed #e9edf2;
            padding-bottom: 0.1rem;
            margin-bottom: 0.1rem;
        }
        .stat-percent {
            font-weight: 600;
            color: #0b1e33;
        }
        .stat-percent .small-count {
            font-weight: 400;
            color: #475569;
            font-size: 0.6rem;
        }
        .error-types {
            display: flex;
            flex-wrap: wrap;
            gap: 0.1rem 0.3rem;
            font-size: 0.6rem;
        }
        .error-types span {
            background: #f1f5f9;
            padding: 0.02rem 0.4rem;
            border-radius: 30px;
            font-size: 0.55rem;
        }
        .no-throws {
            color: #94a3b8;
            font-size: 0.6rem;
            font-style: italic;
        }

        .footer-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.4rem;
            margin-top: 0.4rem;
            border-top: 1px solid #edf2f7;
            padding-top: 0.4rem;
            flex-wrap: wrap;
        }
        .footer-left {
            display: flex;
            gap: 0.4rem;
        }
        .footer-right {
            display: flex;
            gap: 0.4rem;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
                gap: 0.2rem;
            }
            .form-actions {
                flex-wrap: wrap;
            }
            .add-throw-section {
                padding: 0.5rem;
            }
            .footer-actions {
                flex-direction: column;
                align-items: stretch;
            }
            .footer-left, .footer-right {
                justify-content: center;
            }
            .btn {
                width: 100%;
                justify-content: center;
            }
            .undo-bar {
                justify-content: stretch;
            }
            .undo-bar .btn {
                width: 100%;
                justify-content: center;
            }
            .players-grid {
                grid-template-columns: 1fr 1fr;
                gap: 0.4rem;
            }
        }
        @media (max-width: 450px) {
            .players-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div class="app">
    <h1>🥌 Кёрлинг <small>11 игроков</small></h1>

    <div class="add-throw-section">
        <div class="form-grid">
            <div class="form-col">
                <div class="form-group">
                    <label for="playerSelect">Игрок</label>
                    <select id="playerSelect"></select>
                </div>
                <div class="form-group">
                    <label for="shotType">Вид</label>
                    <select id="shotType">
                        <option value="ТейкИн">ТейкИн</option>
                        <option value="ТейкАут">ТейкАут</option>
                        <option value="ДроИн">ДроИн</option>
                        <option value="ДроАут">ДроАут</option>
                    </select>
                </div>
            </div>
            <div class="form-col">
                <div class="form-group">
                    <label for="errorType">Ошибка</label>
                    <select id="errorType">
                        <option value="">—</option>
                        <option value="узко">узко</option>
                        <option value="широко">широко</option>
                        <option value="слабо">слабо</option>
                        <option value="сильно">сильно</option>
                        <option value="другое">другое</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="accuracy">Точность</label>
                    <select id="accuracy">
                        <option value="0">0%</option>
                        <option value="50">50%</option>
                        <option value="100" selected>100%</option>
                    </select>
                </div>
            </div>
            <div class="form-actions">
                <button class="btn btn-primary" id="addThrowBtn">➕ Добавить</button>
                <div class="error-msg" id="formFeedback"></div>
            </div>
        </div>
    </div>

    <div class="undo-bar">
        <button class="btn btn-outline" id="undoBtn">↩ Отменить</button>
    </div>

    <div class="players-grid" id="playersGrid"></div>

    <div class="footer-actions">
        <div class="footer-left">
            <button class="btn btn-success" id="exportCSVBtn">📤 Экспорт</button>
        </div>
        <div class="footer-right">
            <button class="btn btn-import" id="importBtn">📥 Импорт</button>
            <button class="btn btn-danger" id="resetBtn">✖ Сбросить</button>
        </div>
    </div>
</div>

<script>
    const NAMES = ['Александр', 'Максим В.', 'Елена', 'Мария', 'Максим З.', 'Яна', 'Алексей', 'Анна', 'Николай', 'Михаил', 'Руслан'];
    const TYPES = ['ТейкИн', 'ТейкАут', 'ДроИн', 'ДроАут'];
    const ERRORS = ['узко', 'широко', 'слабо', 'сильно', 'другое'];
    const STORAGE = 'curling_stats_data';
    const UNDO_KEY = 'curling_undo_history';
    const MAX_UNDO = 3;

    function emptyStats() {
        const s = {};
        TYPES.forEach(t => s[t] = { count: 0, sum: 0, errors: { узко: 0, широко: 0, слабо: 0, сильно: 0, другое: 0 } });
        return s;
    }

    function load() {
        try {
            const d = JSON.parse(localStorage.getItem(STORAGE));
            if (d && NAMES.every(n => d[n])) return d;
        } catch (_) {}
        const d = {};
        NAMES.forEach(n => d[n] = emptyStats());
        return d;
    }

    let data = load();
    let history = [];

    function loadHistory() {
        try { const h = JSON.parse(localStorage.getItem(UNDO_KEY)); if (Array.isArray(h)) history = h.slice(0, MAX_UNDO); } catch (_) {}
    }
    function saveHistory() { localStorage.setItem(UNDO_KEY, JSON.stringify(history)); }
    function pushState() { history.push(JSON.parse(JSON.stringify(data))); if (history.length > MAX_UNDO) history.shift(); saveHistory(); updateUndo(); }
    function popState() { if (!history.length) return null; const s = history.pop(); saveHistory(); updateUndo(); return s; }
    function save() { localStorage.setItem(STORAGE, JSON.stringify(data)); }

    function pct(stats, t) { const s = stats[t]; return s.count ? Math.round((s.sum / s.count) * 10) / 10 : 0; }

    function render() {
        const grid = document.getElementById('playersGrid');
        grid.innerHTML = '';
        const sel = document.getElementById('playerSelect');
        const cur = sel.value;
        sel.innerHTML = NAMES.map(n => `<option value="${n}">${n}</option>`).join('');
        if (NAMES.includes(cur)) sel.value = cur;

        NAMES.forEach(name => {
            const st = data[name];
            const card = document.createElement('div');
            card.className = 'player-card';
            const header = document.createElement('div');
            header.className = 'player-header';
            header.innerHTML = `<span class="player-name">${name} <span class="dot-blue"></span><span class="dot-red"></span></span><span class="toggle-icon">▾</span>`;
            const body = document.createElement('div');
            body.className = 'player-stats';
            TYPES.forEach(t => {
                const s = st[t];
                const row = document.createElement('div');
                row.className = 'stat-row';
                const p = s.count ? pct(st, t) : 0;
                row.innerHTML = `
                    <div class="stat-label"><span>${t}</span><span class="stat-percent">${s.count ? p + '%' : '0%'} <span class="small-count">(${s.count})</span></span></div>
                    <div class="error-types">${s.count ? (() => { const parts = ERRORS.filter(e => s.errors[e]).map(e => `${e}: ${s.errors[e]}`); return parts.length ? parts.map(p => `<span>${p}</span>`).join('') : '<span style="background:transparent;color:#94a3b8;">ошибок нет</span>'; })() : '<span class="no-throws">нет бросков</span>'}</div>
                `;
                body.appendChild(row);
            });
            header.onclick = () => { const d = body.style.display === 'none'; body.style.display = d ? 'block' : 'none'; header.querySelector('.toggle-icon').textContent = d ? '▴' : '▾'; };
            card.append(header, body);
            grid.appendChild(card);
        });
        updateUndo();
    }

    function updateUndo() {
        const btn = document.getElementById('undoBtn');
        const c = history.length;
        btn.disabled = !c;
        btn.innerHTML = `↩ Отменить${c ? ` <span class="undo-badge">${c}</span>` : ''}`;
    }

    function addThrow() {
        const name = document.getElementById('playerSelect').value;
        const type = document.getElementById('shotType').value;
        const err = document.getElementById('errorType').value;
        const acc = parseInt(document.getElementById('accuracy').value);
        if (!NAMES.includes(name)) return showFeedback('Выберите игрока');
        pushState();
        const s = data[name][type];
        s.count++;
        s.sum += acc;
        if (err && ERRORS.includes(err)) s.errors[err]++;
        save();
        render();
        hideFeedback();
        document.getElementById('errorType').value = '';
        document.getElementById('accuracy').value = '100';
    }

    function exportCSV() {
        let csv = '\uFEFFИгрок;';
        TYPES.forEach(t => { csv += `${t} %;${t} кол-во;`; ERRORS.forEach(e => csv += `${t} ${e};`); });
        csv = csv.slice(0, -1) + '\n';
        NAMES.forEach(name => {
            const st = data[name];
            let row = name + ';';
            TYPES.forEach(t => {
                const s = st[t];
                row += (s.count ? pct(st, t) : 0) + ';' + s.count + ';';
                ERRORS.forEach(e => row += (s.errors[e] || 0) + ';');
            });
            csv += row.slice(0, -1) + '\n';
        });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
        a.download = `curling_${new Date().toISOString().slice(0,10)}.csv`;
        a.click();
        URL.revokeObjectURL(a.href);
    }

    function importCSV(file) {
        const r = new FileReader();
        r.onload = function(e) {
            try {
                const lines = e.target.result.split('\n').filter(l => l.trim());
                if (lines.length < 2) return alert('Пустой файл');
                const headers = lines[0].replace(/^\uFEFF/, '').split(';');
                if (headers[0] !== 'Игрок') return alert('Неверный формат');
                if (!confirm('Заменить текущую статистику?')) return;
                const nd = {};
                NAMES.forEach(n => nd[n] = emptyStats());
                for (let i = 1; i < lines.length; i++) {
                    const vals = lines[i].split(';').map(v => v.trim());
                    const name = vals[0];
                    if (!NAMES.includes(name)) continue;
                    let idx = 1;
                    TYPES.forEach(t => {
                        const pctVal = parseFloat(vals[idx]) || 0;
                        const count = parseInt(vals[idx + 1]) || 0;
                        idx += 2;
                        const s = nd[name][t];
                        s.count = count;
                        s.sum = count ? Math.round((pctVal / 100) * count * 10) / 10 : 0;
                        ERRORS.forEach(e => { s.errors[e] = parseInt(vals[idx]) || 0; idx++; });
                    });
                }
                data = nd;
                history = [];
                saveHistory();
                save();
                render();
                alert('Импорт выполнен');
            } catch (err) { alert('Ошибка: ' + err.message); }
        };
        r.readAsText(file, 'UTF-8');
    }

    function showFeedback(msg) { const fb = document.getElementById('formFeedback'); fb.textContent = msg; fb.style.display = 'inline-block'; }
    function hideFeedback() { document.getElementById('formFeedback').style.display = 'none'; }

    document.addEventListener('DOMContentLoaded', function() {
        loadHistory();
        render();
        document.getElementById('addThrowBtn').onclick = addThrow;
        document.getElementById('resetBtn').onclick = () => { if (confirm('Сбросить всё?')) { history = []; saveHistory(); data = {}; NAMES.forEach(n => data[n] = emptyStats()); save(); render(); } };
        document.getElementById('undoBtn').onclick = () => { if (!history.length) return showFeedback('Нет действий'); if (confirm('Отменить последний бросок?')) { const s = popState(); if (s) { data = s; save(); render(); hideFeedback(); } } };
        document.getElementById('exportCSVBtn').onclick = exportCSV;
        document.getElementById('importBtn').onclick = () => document.getElementById('fileInput').click();
        document.getElementById('fileInput').onchange = function() { if (this.files && this.files[0]) { importCSV(this.files[0]); this.value = ''; } };
        document.querySelectorAll('#playerSelect, #shotType, #errorType, #accuracy').forEach(el => el.addEventListener('keypress', e => { if (e.key === 'Enter') { e.preventDefault(); addThrow(); } }));
    });
</script>
</body>
</html>
